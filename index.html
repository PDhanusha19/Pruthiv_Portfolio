<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIVNFX — Video Editor | Short Reels, SaaS Explainers & Documentary Edits</title>
<meta name="description" content="DIVNFX is a video editor, motion designer and animator. Short Reels for creators and podcasts, SaaS explainer ads and documentary-style edits.">
<meta property="og:title" content="DIVNFX — Video Editor | Short Reels, SaaS Explainers & Documentary Edits">
<meta property="og:description" content="DIVNFX is a video editor, motion designer and animator. Short Reels for creators and podcasts, SaaS explainer ads and documentary-style edits.">
<meta property="og:type" content="website">
<!-- FONT: Libre Franklin (Google Fonts). For Balto, add your Adobe Fonts kit link here; site.css (--font) already lists it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="index.html" data-title="" >
<main>
<div id="status" class="status" role="status"></div>
<div id="content" hidden>
<!-- All text comes from content.json -->
<section class="hero hero-video">
  <!-- Background loop video. The file is chosen in site.js (smaller one on phones). Poster shows while it loads. -->
  <video id="heroVideo" class="hero-bg" autoplay muted loop playsinline preload="auto" poster="images/hero-poster.jpg"
         data-src="images/hero-background.mp4" data-src-mobile="images/hero-background-mobile.mp4"
         aria-hidden="true" tabindex="-1" disablepictureinpicture></video>
  <div class="hero-overlay"></div>
  <div class="wrap hero-grid">
    <!-- LEFT: counter. Number and label come from content.json (statNumber / statLabel) -->
    <div class="hero-stat">
      <div class="stat-num"><span id="statCount" data-bind="statNumber">100</span><span class="stat-plus">+</span></div>
      <div class="stat-label" data-bind="statLabel">Projects</div>
    </div>
    <!-- CENTER: heading + intro (unchanged, from content.json) -->
    <div class="hero-main">
      <h1 data-bind="heroHeading"></h1>
      <p class="lead" data-bind="intro"></p>
    </div>
    <!-- RIGHT: software icon marquee. Icon files: images/software/*.svg. The second list is a copy so the loop is seamless. -->
    <div class="hero-marquee marquee" aria-label="Software I use: Premiere Pro, After Effects, Photoshop, CapCut, Figma, Canva">
      <div class="marquee-track">
        <ul class="marquee-set">
          <li><img src="images/software/premiere-pro.svg" alt="Adobe Premiere Pro" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/after-effects.svg" alt="Adobe After Effects" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/photoshop.svg" alt="Adobe Photoshop" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/capcut.svg" alt="CapCut" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/figma.svg" alt="Figma" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/canva.svg" alt="Canva" width="56" height="56" loading="lazy" decoding="async"></li>
        </ul>
        <ul class="marquee-set" aria-hidden="true">
          <li><img src="images/software/premiere-pro.svg" alt="" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/after-effects.svg" alt="" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/photoshop.svg" alt="" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/capcut.svg" alt="" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/figma.svg" alt="" width="56" height="56" loading="lazy" decoding="async"></li>
          <li><img src="images/software/canva.svg" alt="" width="56" height="56" loading="lazy" decoding="async"></li>
        </ul>
      </div>
    </div>
  </div>
</section>
<section class="band" id="reelBand"><div class="wrap"><div class="reel"><div class="frame" id="reelFrame"></div></div></div></section>
<section class="section">
  <div class="wrap">
    <div class="head center"><h2>Featured Projects</h2></div>
    <div class="grid" id="grid" data-mode="featured"></div>
  </div>
</section>
</div>
</main>
<script src="site.js"></script>
</body>
</html>
