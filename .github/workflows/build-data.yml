# Rebuilds data.json whenever you save a project, video or category in Pages CMS.
# (data.json is the single file the website reads. No setup needed — it runs by itself.)
name: Build data.json

on:
  push:
    branches: [main]
    paths:
      - "categories/**"
      - "projects/**"
      - "videos/**"
      - "build-data.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data.json
        run: node build-data.js
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "data.json already up to date"
          else
            git commit -m "Update data.json (auto)"
            git pull --rebase origin main
            git push
          fi
