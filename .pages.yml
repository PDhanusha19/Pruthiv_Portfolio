# Pages CMS configuration — https://pagescms.org
# This is the whole "admin" for the portfolio. Keep this file at the ROOT of the GitHub repository.
#
# MENU (left side of Pages CMS)
#   Projects            the cards on Home + Projects page (title, short description, category, thumbnail, featured, published ...)
#   Short Reels         the vertical YouTube Shorts on the Short Reels page (add, hide, reorder)
#   Categories          the filter buttons on the Projects page (add / rename / reorder / delete)
#   Typography & Design font sizes (px), fonts, colors, alignment
#   Site content        name, intro, bio, photo, email, social links
#
# Every entry owns its OWN file, so saving one never touches or deletes another (Pages CMS rewrites a file
# from the fields listed here). After you save, a small GitHub Action rebuilds data.json and the site updates.

media:
  input: images          # uploaded images are saved in the repo folder  /images
  output: /images        # and used on the website as                   /images/<file>

content:
  # ---------------------------------------------------------------- PROJECTS
  - name: projects
    label: Projects
    type: collection
    path: data/projects
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [category, isFeatured, published, displayOrder]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The page address (slug) is made from the title automatically."
      - name: subtitle
        label: Short description
        type: string
        description: "The grey line on the project card. If empty, the first sentence of the long description is used."
      - name: category
        label: Category
        type: reference
        options:
          collection: categories
          search: name
        description: "Decides which filter button shows this project. Add new categories in the 'Categories' menu first."
      - name: thumbnail
        label: Thumbnail (16:9)
        type: image
        description: "The card image, 16:9 (for example 1280 x 720). Optional for YouTube, which uses its own thumbnail."
      - name: isFeatured
        label: Featured on homepage
        type: boolean
        default: false
        description: "ON = shown in 'Featured Projects' on the Home page. OFF = removed from there (it stays on the Projects page)."
      - name: published
        label: Published
        type: boolean
        default: true
        description: "OFF hides the project everywhere on the site without deleting it."
      - name: displayOrder
        label: Display order
        type: number
        description: "Small numbers come first (1, 2, 3...). Leave empty to put it last."
      - name: videoUrl
        label: Video URL (optional)
        type: string
        description: "YouTube, Instagram reel or TikTok link. Plays on the project page."
      - name: videoPlatform
        label: Video platform
        type: select
        default: Auto-detect
        options:
          values: [Auto-detect, YouTube, Instagram, TikTok]
        description: "Leave on Auto-detect."
      - name: description
        label: Long description (project page)
        type: text
        description: "Shown on the project page. Leave a blank line between paragraphs."
      - name: selectedFrames
        label: Selected frames
        type: image
        list: true
        description: "Still images shown under the video on the project page. Drag to reorder."
      - name: linkUrl
        label: "Advanced: open this page instead"
        type: string
        description: "Leave empty for normal projects. The Short Reels card uses /projects/short-reels/."
      - name: reelsCollage
        label: "Advanced: use Short Reels collage as the card image"
        type: boolean
        default: false
        description: "Only for the Short Reels card. Shows the first reels as the card image when no thumbnail is set."
      - name: createdAt
        label: Created
        type: date
      - name: updatedAt
        label: Last updated
        type: date

  # ---------------------------------------------------------------- SHORT REELS
  - name: reels
    label: Short Reels
    type: collection
    path: data/reels
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [published, displayOrder]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: url
        label: YouTube Shorts URL
        type: string
        required: true
        description: "Paste the Shorts link (youtube.com/shorts/... or youtu.be/...). The video ID and thumbnail are picked up automatically."
      - name: thumbnail
        label: Thumbnail (optional override)
        type: image
        description: "Leave empty to use the YouTube thumbnail. Upload a 9:16 image only if you want a different cover."
      - name: displayOrder
        label: Display order
        type: number
        description: "Small numbers come first. Change the numbers to reorder the reels."
      - name: published
        label: Published
        type: boolean
        default: true
        description: "OFF hides the reel from the website without deleting it."

  # ---------------------------------------------------------------- CATEGORIES
  - name: categories
    label: Categories
    type: collection
    path: data/categories
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [displayOrder]
    fields:
      - name: name
        label: Category name
        type: string
        required: true
        description: "Shown as a filter button on the Projects page. Renaming it is safe. If you delete a category, its projects stay on the site under 'All Projects'."
      - name: displayOrder
        label: Button order
        type: number
        description: "Small numbers come first (after 'All Projects')."
      - name: createdAt
        label: Created
        type: date
        description: "Used for the order when 'Button order' is empty (oldest first)."

  # ---------------------------------------------------------------- TYPOGRAPHY & DESIGN  (settings.json)
  - name: settings
    label: Typography & Design
    type: file
    path: settings.json
    format: json
    fields:
      - name: typography
        label: Typography (font sizes)
        type: object
        description: "Exact text sizes in pixels. 'Original' keeps the site's built-in responsive size. Changes apply to every page."
        fields:
          - name: bodySize
            label: Body text
            type: select
            default: 16px
            options:
              values: [14px, 15px, 16px, 17px, 18px]
            description: "The base size of normal text. (Original: 16px)"
          - name: introSize
            label: Home intro text
            type: select
            default: Original
            options:
              values: [Original, 14px, 15px, 16px, 17px, 18px, 20px]
            description: "The grey line under the big HELLO heading."
          - name: descriptionSize
            label: Descriptions (project, About, Contact)
            type: select
            default: Original
            options:
              values: [Original, 14px, 15px, 16px, 17px, 18px]
            description: "Project descriptions and the About text."
          - name: cardTextSize
            label: Card text (grey line on cards)
            type: select
            default: Original
            options:
              values: [Original, 13px, 14px, 15px, 16px]
            description: "The grey line under each card title. (Original is about 14px)"
          - name: cardTitleSize
            label: Card titles
            type: select
            default: Original
            options:
              values: [Original, 16px, 17px, 18px, 20px]
            description: "Project and video titles on cards. (Original is about 17.6px)"
          - name: menuSize
            label: Menu links
            type: select
            default: Original
            options:
              values: [Original, 12px, 13px, 14px, 15px]
            description: "HOME / PROJECTS / ABOUT / CONTACT in the top bar. (Original is about 13px)"
      - name: design
        label: Design Settings
        type: object
        description: "Changes the look of every page. ORIGINAL values: fonts Balto, sizes Medium, heading/text color Black #0A0A0A, grey text #6B6B6B, hero Center, section headings Original (as designed), About Left, Project pages Left. To reset, pick these again or clear the field."
        fields:
          - name: fonts
            label: Fonts
            type: object
            fields:
              - name: heading
                label: Heading font
                type: select
                default: Balto
                options:
                  values: [Balto, Libre Franklin, Inter, Archivo, Bebas Neue, Space Grotesk]
                description: "Big titles like HELLO, I'M DIVNFX and the menu. (Original: Balto)"
              - name: body
                label: Body text font
                type: select
                default: Balto
                options:
                  values: [Balto, Libre Franklin, Inter, Archivo, Bebas Neue, Space Grotesk]
                description: "Paragraphs, descriptions and buttons. (Original: Balto)"
          - name: sizes
            label: Heading sizes
            type: object
            fields:
              - name: hero
                label: Hero heading size
                type: select
                default: Medium
                options:
                  values: [Small, Medium, Large, Extra Large]
                description: "The big HELLO heading on the home page and project titles. (Original: Medium)"
              - name: section
                label: Section heading size
                type: select
                default: Medium
                options:
                  values: [Small, Medium, Large]
                description: "Headings like FEATURED PROJECTS and ABOUT ME. (Original: Medium)"
          - name: colors
            label: Colors
            type: object
            fields:
              - name: heading
                label: Heading color
                type: select
                default: "#0A0A0A"
                options:
                  values:
                    - { value: "#0A0A0A", label: "Black (#0A0A0A)" }
                    - { value: "#333333", label: "Charcoal (#333333)" }
                    - { value: "#555555", label: "Dark Grey (#555555)" }
                    - { value: "#6B6B6B", label: "Grey (#6B6B6B)" }
                    - { value: "#9A9A9A", label: "Light Grey (#9A9A9A)" }
                    - { value: "#FFFFFF", label: "White (#FFFFFF) - invisible on the white page, ignored" }
                description: "Color of all titles. (Original: Black)"
              - name: headingCustom
                label: Heading color - custom (optional)
                type: string
                description: "Type your own color like #1A1A1A to replace the choice above. Leave empty to use the choice."
              - name: text
                label: Body text color
                type: select
                default: "#0A0A0A"
                options:
                  values:
                    - { value: "#0A0A0A", label: "Black (#0A0A0A)" }
                    - { value: "#333333", label: "Charcoal (#333333)" }
                    - { value: "#555555", label: "Dark Grey (#555555)" }
                    - { value: "#6B6B6B", label: "Grey (#6B6B6B)" }
                    - { value: "#9A9A9A", label: "Light Grey (#9A9A9A)" }
                    - { value: "#FFFFFF", label: "White (#FFFFFF) - invisible on the white page, ignored" }
                description: "Color of normal text. (Original: Black)"
              - name: textCustom
                label: Body text color - custom (optional)
                type: string
                description: "Optional custom color like #1A1A1A."
              - name: muted
                label: Secondary (grey) text color
                type: select
                default: "#6B6B6B"
                options:
                  values:
                    - { value: "#0A0A0A", label: "Black (#0A0A0A)" }
                    - { value: "#333333", label: "Charcoal (#333333)" }
                    - { value: "#555555", label: "Dark Grey (#555555)" }
                    - { value: "#6B6B6B", label: "Grey (#6B6B6B)" }
                    - { value: "#9A9A9A", label: "Light Grey (#9A9A9A)" }
                    - { value: "#FFFFFF", label: "White (#FFFFFF) - invisible on the white page, ignored" }
                description: "Descriptions, menu links and small details. (Original: Grey #6B6B6B)"
              - name: mutedCustom
                label: Secondary text color - custom (optional)
                type: string
                description: "Optional custom color like #777777."
          - name: alignment
            label: Alignment
            type: object
            description: "On phones, Center stays centered and everything else becomes left-aligned so text stays easy to read."
            fields:
              - name: hero
                label: Hero text alignment
                type: select
                default: Center
                options:
                  values: [Left, Center, Right]
                description: "The HELLO heading and intro on the home page. (Original: Center)"
              - name: sections
                label: Section headings alignment
                type: select
                default: "Original (as designed)"
                options:
                  values: ["Original (as designed)", Left, Center, Right]
                description: "'Original' keeps the designed layout (Featured Projects centered, others left)."
              - name: about
                label: About section text alignment
                type: select
                default: Left
                options:
                  values: [Left, Center, Justify]
                description: "The text on the About page. (Original: Left)"
              - name: styles
                label: Project pages alignment (title + description)
                type: select
                default: Left
                options:
                  values: [Left, Center]
                description: "Title and description on project pages. (Original: Left)"

  # ---------------------------------------------------------------- SITE CONTENT  (content.json)
  - name: site
    label: Site content
    type: file
    path: content.json
    format: json
    fields:
      - name: brand
        label: Brand name (navbar + footer)
        type: string
        required: true
      - name: heroHeading
        label: Home page heading
        type: string
      - name: intro
        label: Intro (under the home page heading)
        type: text
      - name: bio
        label: About me text (leave a blank line between paragraphs)
        type: text
      - name: photo
        label: About photo (shown in black & white)
        type: image
      - name: skills
        label: Skills & software
        type: string
        list: true
      - name: email
        label: Email
        type: string
        required: true
      - name: instagram
        label: Instagram link
        type: string
      - name: tiktok
        label: TikTok profile link
        type: string
      - name: whatsapp
        label: WhatsApp number with country code (e.g. +94771234567)
        type: string
      - name: reelsIntro
        label: Short Reels page - one-line intro
        type: string
        description: "The sentence under the SHORT REELS title."
      - name: statNumber
        label: Home banner counter - number
        type: number
        description: "The big number on the left of the home banner (it counts up from 0). Example: 100 shows 100+."
      - name: statLabel
        label: Home banner counter - label
        type: string
        description: "The word under the number, for example Projects."
