# Pages CMS configuration — https://pagescms.org
# Lets a non-technical person edit content.json through simple forms.
# Keep this file at the ROOT of your GitHub repository (next to index.html and content.json).

media:
  input: images          # uploaded images are saved in the repo folder  /images
  output: /images        # and referenced on the website as            /images/<file>

content:
  - name: site
    label: Website content
    type: file
    path: content.json
    format: json
    fields:
      - name: brand
        label: Brand name (navbar + footer)
        type: string
        required: true

      - name: heroHeading
        label: Home page heading
        type: string

      - name: intro
        label: Intro (under the home page heading)
        type: text

      - name: showreel
        label: Showreel link (YouTube)
        type: string

      - name: bio
        label: About me text (leave a blank line between paragraphs)
        type: text

      - name: photo
        label: About photo (shown in black & white)
        type: image

      - name: skills
        label: Skills & software
        type: string
        list: true

      - name: email
        label: Email
        type: string
        required: true

      - name: instagram
        label: Instagram link
        type: string

      - name: styles
        label: Styles (the three cards on the home page, each with its own page)
        type: object
        list: true
        fields:
          - name: slug
            label: Page ID (don't change)
            type: string
            required: true
          - name: page
            label: Page file (don't change)
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: subtitle
            label: Subtitle (grey line on the home card)
            type: string
          - name: thumb
            label: Card thumbnail (optional — defaults to the main video thumbnail)
            type: image
          - name: description
            label: Description (1–2 short paragraphs)
            type: text
          - name: mainVideo
            label: Main video link (YouTube, Instagram reel or TikTok)
            type: string
          - name: work
            label: List of Work
            type: object
            list: true
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: description
                label: Description
                type: string
              - name: category
                label: Category
                type: select
                options:
                  values: [YouTube, Instagram, TikTok]
              - name: url
                label: Video link
                type: string
                required: true
              - name: thumb
                label: Thumbnail (optional — needed for Instagram and TikTok)
                type: image
          - name: frames
            label: Selected Frames (use 3)
            type: object
            list: true
            fields:
              - name: image
                label: Image
                type: image
              - name: alt
                label: Short description of the image
                type: string
