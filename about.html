<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Portfolio</title>
<meta name="description" content="Video editor portfolio.">
<!-- FONT: Libre Franklin (Google Fonts). For Balto, add your Adobe Fonts kit link here; site.css (--font) already lists it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">

    <h2>About</h2>
    <p data-bind="bio"></p>
    <ul class="tags" data-skills></ul>
    <p style="margin-bottom:0"><a class="btn" href="contact.html">Work with me</a></p>
  </div>
</section>
</div>
</main>
<script src="site.js"></script>
</body>
</html>
